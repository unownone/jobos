name: Deploy

# GitHub Release (from release.yml on merge to main) SSHs into the Hub host,
# pulls the release tag from GHCR, and applies compose. GitHub-hosted only.
# The git tree is not copied. Merge requests never ship.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (vYYYY.MM.DD-<sha7>)"
        required: true
        type: string

concurrency:
  group: deploy-jobos-host
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: ssh pull GHCR tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Require host SSH key
        env:
          JOBOS_HOST_SSH_KEY: ${{ secrets.JOBOS_HOST_SSH_KEY }}
          JOBOS_DEPLOY_KEY: ${{ secrets.JOBOS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${JOBOS_HOST_SSH_KEY}" || -n "${JOBOS_DEPLOY_KEY}" ]]; then
            echo "Host SSH key secret is present."
            exit 0
          fi
          cat <<'EOF' >&2
          Deploy cannot SSH into the Hub host. Add these GitHub repository secrets / variables:

            Secret JOBOS_HOST_SSH_KEY
              Private OpenSSH key whose public half is in opc's authorized_keys
              on the OCI box. (Fallback: JOBOS_DEPLOY_KEY if that key already
              logs you into the box.)

            Variable JOBOS_HOST
              Hostname or IP (this hunt: 129.225.116.58)

            Variable JOBOS_HOST_USER
              SSH user (default opc if unset)

            Optional secret JOBOS_HOST_KNOWN_HOSTS
              ssh-keyscan -H $JOBOS_HOST  (pins the host key)

          On the box:
            1. Install the matching public key in ~/.ssh/authorized_keys
            2. Allow inbound TCP 22 from GitHub-hosted Actions (or 0.0.0.0/0)
            3. Disable the old self-hosted runner + git watcher:
                 sudo systemctl disable --now jobos-github-runner.service
                 sudo systemctl disable --now jobos-deploy-watch.timer

          Full checklist: docs/deploy.md
          EOF
          exit 1

      - name: SSH pull and apply
        env:
          JOBOS_HOST: ${{ vars.JOBOS_HOST || secrets.JOBOS_HOST || '129.225.116.58' }}
          JOBOS_HOST_USER: ${{ vars.JOBOS_HOST_USER || secrets.JOBOS_HOST_USER }}
          JOBOS_HOST_SSH_PORT: ${{ vars.JOBOS_HOST_SSH_PORT || secrets.JOBOS_HOST_SSH_PORT }}
          JOBOS_HOST_SSH_KEY_DATA: ${{ secrets.JOBOS_HOST_SSH_KEY || secrets.JOBOS_DEPLOY_KEY }}
          JOBOS_HOST_KNOWN_HOSTS: ${{ secrets.JOBOS_HOST_KNOWN_HOSTS }}
          JOBOS_DEPLOY_DIR: ${{ vars.JOBOS_DEPLOY_DIR || secrets.JOBOS_DEPLOY_DIR }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOBOS_GHCR_IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/hub_remote_deploy.sh "$TAG"
