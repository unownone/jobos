name: Deploy check

# Merge-request gate for Job Hub host deploy. This does not ship to production.
# Release + Deploy stay on merge to main / published GitHub Releases.

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: deploy-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selftest:
    name: deploy wiring selftest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Offline deploy + SSH wiring checks
        run: bash scripts/deploy_selftest.sh

  image-smoke:
    name: docker build smoke (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: jobos-hub:smoke
          cache-from: type=gha,scope=smoke-linux-amd64
          cache-to: type=gha,mode=max,scope=smoke-linux-amd64
          provenance: false
