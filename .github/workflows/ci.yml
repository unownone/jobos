name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: board
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: board/uv.lock

      - name: Install board (dev)
        run: uv sync --frozen --group dev

      - name: Ruff
        run: uv run ruff check . ../scripts

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: board
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: board/uv.lock

      - name: Install board (dev)
        run: uv sync --frozen --group dev

      - name: Unit tests
        run: uv run pytest -m unit --strict-markers --tb=short

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: board
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: board/uv.lock

      - name: Install board (dev)
        run: uv sync --frozen --group dev

      - name: E2E tests (in-process HTTP TestClient)
        run: uv run pytest -m e2e --strict-markers --tb=short
