# Production Job Hub. Image comes from GHCR; this host never builds from source.
#   JOBOS_IMAGE=ghcr.io/unownone/jobos:vYYYY.MM.DD-<sha> docker compose -f deploy/compose.yml up -d
# Keep `name: jobos` so volume jobos_hub-data (SQLite, tokens, resume) is reused.
#
# Local/dev still uses the repo-root docker-compose.yml (build from Dockerfile).

name: jobos

services:
  traefik:
    image: traefik:v3.3
    ports:
      - "80:80"
      - "443:443"
      - "8787:8787"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy

  hub:
    image: ${JOBOS_IMAGE:-ghcr.io/unownone/jobos:latest}
    pull_policy: always
    environment:
      JOBOS_NONINTERACTIVE: "1"
      BOARD_HOST: "0.0.0.0"
      BOARD_PORT: "8787"
      HUB_PUBLIC_HOST: "${HUB_PUBLIC_HOST:-}"
      HUB_PUBLIC_URL: "${HUB_PUBLIC_URL:-}"
    volumes:
      - hub-data:/data
    expose:
      - "8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  hub-data:
