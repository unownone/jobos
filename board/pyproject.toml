[project]
name = "jobos-hunt-board"
version = "0.1.0"
description = "Maintainer-owned private hunt board (FastAPI + PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "gunicorn>=23",
  "uvicorn-worker>=0.2",
  "python-multipart>=0.0.12",
  "argon2-cffi>=23",
  "pyyaml>=6",
  "psycopg[binary]>=3.2",
  "opentelemetry-sdk>=1.44.0",
  "opentelemetry-instrumentation-logging>=0.65b0",
  "opentelemetry-instrumentation-fastapi>=0.65b0",
  "pika>=1.3",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.9",
  # No linux aarch64 wheels (Coolify / Pi / Graviton). Tests use Postgres there.
  "pgserver>=0.1.4; sys_platform != 'linux' or platform_machine != 'aarch64'",
]

[tool.uv]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "no_candidate: do not seed a candidate.yaml fixture (gate tests)",
  "e2e: in-process HTTP TestClient / page contract tests (no extra server)",
  "unit: fast tests that do not boot the FastAPI app",
  "browser: Playwright tests against a live Hub (Compose or local uvicorn)",
]

[tool.ruff]
target-version = "py311"
src = ["app", "tests", "scripts"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
