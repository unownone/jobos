[project]
name = "jobos-hunt-board"
version = "0.1.0"
description = "Maintainer-owned private hunt board (FastAPI + SQLite)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "argon2-cffi>=23",
  "pyyaml>=6",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "no_candidate: do not seed a candidate.yaml fixture (gate tests)",
  "e2e: in-process HTTP TestClient / page contract tests (no extra server)",
  "unit: fast tests that do not boot the FastAPI app",
]

[tool.ruff]
target-version = "py311"
src = ["app", "tests", "scripts"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
