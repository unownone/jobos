<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>jobOS — Data</title>
  <link rel="icon" href="/brand/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/static/theme.css" />
  <link rel="stylesheet" href="/static/hub.css" />
  
</head>
<body class="hub-app">
  <a class="skip" href="#main">Skip to content</a>
  <nav class="hub-rail" aria-label="Hub">
    <a class="hub-brand" href="/board"><img src="/brand/mascot.png" width="36" height="36" alt="jobOS" /></a>
    <a class="hub-nav-item" data-icon="board" data-nav="/board" href="/board">Board</a>
    <a class="hub-nav-item" data-icon="directory" data-nav="/admin/users" href="/admin/users">Directory</a>
    <a class="hub-nav-item" data-icon="invites" data-nav="/admin" href="/admin">Invites</a>
    <a class="hub-nav-item" data-icon="data" data-nav="/admin/data" href="/admin/data">Data</a>
    <a class="hub-nav-item" data-icon="skills" data-nav="/admin/skills" href="/admin/skills">Skills</a>
    <a class="hub-nav-item" data-icon="memory" data-nav="/admin/memory" href="/admin/memory">Memory</a>
    <a class="hub-nav-item" data-icon="candidate" data-nav="/onboarding" href="/onboarding">Candidate</a>
    <span class="hub-rail-spacer"></span>
    <button class="hub-nav-item" type="button" data-icon="logout" data-hub-logout>Log out</button>
  </nav>
  <div class="hub-stage">

  <header class="hub-top">
    <div>
      <h1>jobOS data</h1>
      <p class="sub">Jobs, people, candidate, registry, memory — filter, do not dump.</p>
    </div>
  </header>
  <main class="hub-page" id="main">
    <p id="who" class="muted">Checking session…</p>
    <div class="tabs" id="tabs"></div>
    <div class="filters" id="filters"></div>
    <p class="stats" id="stats"></p>
    <p class="err" id="err"></p>
    <div id="table"></div>
  </main>
  <script>
    const TABS = ["jobs", "people", "candidate", "skills", "mcps", "memory"];
    let tab = new URLSearchParams(location.search).get("tab") || "jobs";
    if (!TABS.includes(tab)) tab = "jobs";

    function csrfHeaders() {
      const hit = document.cookie.split("; ").find((c) => c.startsWith("hub_csrf="));
      const val = hit ? decodeURIComponent(hit.split("=").slice(1).join("=")) : "";
      return { "Content-Type": "application/json", "X-CSRF": val };
    }
    function pill(text) {
      return '<span class="pill">' + escapeHtml(text || "") + "</span>";
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"'`]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;","`":"&#96;" }[c]));
    }
    async function api(path) {
      const res = await fetch(path, { headers: csrfHeaders() });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const detail = data.detail;
        throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail || data));
      }
      return data;
    }
    function renderTabs() {
      document.getElementById("tabs").innerHTML = TABS.map((name) =>
        `<button type="button" class="${name === tab ? "on" : ""}" data-tab="${name}">${name}</button>`
      ).join("");
      document.querySelectorAll("#tabs button").forEach((btn) => {
        btn.onclick = () => {
          tab = btn.dataset.tab;
          history.replaceState(null, "", "?tab=" + tab);
          load();
        };
      });
    }
    function renderFilters() {
      const el = document.getElementById("filters");
      if (tab === "jobs") {
        el.innerHTML = `
          <input id="q" placeholder="Search company / title" />
          <input id="status" placeholder="status (apply_ready…)" />
          <select id="stopped">
            <option value="">Stopped: any</option>
            <option value="false">active</option>
            <option value="true">stopped</option>
          </select>
          <button type="button" id="go">Filter</button>`;
      } else if (tab === "people") {
        el.innerHTML = `<input id="q" placeholder="Search name / company" /><button type="button" id="go">Filter</button>`;
      } else if (tab === "skills") {
        el.innerHTML = `
          <select id="tag">
            <option value="">all tags</option>
            <option value="source">source</option>
            <option value="apply">apply</option>
            <option value="outreach">outreach</option>
          </select>
          <select id="scope">
            <option value="">shared + mine</option>
            <option value="shared">shared</option>
            <option value="local">local</option>
          </select>
          <button type="button" id="go">Filter</button>`;
      } else if (tab === "mcps") {
        el.innerHTML = `<button type="button" id="go">Refresh</button>
          <span class="muted">Hosted MCP catalog from <code>GET /api/onboarding</code> (connectors_needed). Always use registry MCPs.</span>`;
      } else if (tab === "memory") {
        el.innerHTML = `<input id="q" placeholder="Search facts" /><input id="kind" placeholder="kind" /><button type="button" id="go">Recall</button>`;
      } else {
        el.innerHTML = `<button type="button" id="go">Refresh</button>
          <span class="muted">Re-fetch public slice. Agents must not cache; Cache-Control is no-store.</span>`;
      }
      const go = document.getElementById("go");
      if (go) go.onclick = load;
    }
    function table(headers, rows) {
      if (!rows.length) {
        document.getElementById("table").innerHTML = '<div class="panel muted">No rows match these filters.</div>';
        return;
      }
      document.getElementById("table").innerHTML = `
        <table class="hub-cards">
          <thead><tr>${headers.map((h) => "<th>" + escapeHtml(h) + "</th>").join("")}</tr></thead>
          <tbody>${rows.join("")}</tbody>
        </table>`;
    }
    async function load() {
      document.getElementById("err").textContent = "";
      renderTabs();
      renderFilters();
      try {
        if (tab === "jobs") {
          const q = document.getElementById("q")?.value.trim() || "";
          const status = document.getElementById("status")?.value.trim() || "";
          const stopped = document.getElementById("stopped")?.value || "";
          const params = new URLSearchParams();
          if (q) params.set("q", q);
          if (status) params.set("status", status);
          if (stopped) params.set("stopped", stopped);
          const data = await api("/api/jobs?" + params.toString());
          document.getElementById("stats").textContent = (data.count || 0) + " shown · " + (data.total || 0) + " total";
          table(["ID", "Company", "Title", "Status", "Score"], (data.jobs || []).map((j) =>
            `<tr><td data-label="ID"><code>${escapeHtml(j.id)}</code></td><td data-label="Company">${escapeHtml(j.company)}</td><td data-label="Title">${escapeHtml(j.title)}</td><td data-label="Status">${pill(j.status)}</td><td data-label="Score">${j.score ?? ""}</td></tr>`
          ));
        } else if (tab === "people") {
          const q = document.getElementById("q")?.value.trim() || "";
          const params = new URLSearchParams();
          if (q) params.set("q", q);
          const data = await api("/api/people?" + params.toString());
          document.getElementById("stats").textContent = (data.count || 0) + " people";
          table(["ID", "Name", "Company", "Title", "Job"], (data.people || []).map((p) =>
            `<tr><td><code>${escapeHtml(p.id)}</code></td><td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.company || "")}</td><td>${escapeHtml(p.title || "")}</td><td>${escapeHtml(p.job_id || "")}</td></tr>`
          ));
        } else if (tab === "candidate") {
          const pub = await api("/api/candidate/public");
          const st = await api("/api/candidate/status");
          document.getElementById("stats").textContent = "revision " + (pub.revision || "none") + " · onboarded " + st.onboarded;
          const titles = ((pub.target || {}).titles || []).join(", ");
          const locs = ((pub.target || {}).locations || []).join(", ");
          const breaks = ((pub.target || {}).deal_breakers || []).join(", ");
          table(["Field", "Value"], [
            `<tr><td>present</td><td>${pill(String(pub.present))}</td></tr>`,
            `<tr><td>revision</td><td><code>${escapeHtml(pub.revision || "")}</code></td></tr>`,
            `<tr><td>source</td><td>${escapeHtml(pub.source || "")}</td></tr>`,
            `<tr><td>titles</td><td>${escapeHtml(titles)}</td></tr>`,
            `<tr><td>locations</td><td>${escapeHtml(locs)}</td></tr>`,
            `<tr><td>deal_breakers</td><td>${escapeHtml(breaks)}</td></tr>`,
            `<tr><td>work_authorization</td><td>${escapeHtml(pub.work_authorization || "")}</td></tr>`,
            `<tr><td>resume</td><td>${escapeHtml(pub.resume_url || "")}</td></tr>`,
            `<tr><td>agent curl</td><td><code>curl -sS "$HUB_URL/api/candidate/public" -H "Authorization: Bearer $HUB_KEY"</code></td></tr>`,
          ]);
        } else if (tab === "skills") {
          const tag = document.getElementById("tag")?.value || "";
          const scope = document.getElementById("scope")?.value || "";
          const params = new URLSearchParams();
          if (tag) params.set("tag", tag);
          if (scope) params.set("scope", scope);
          const data = await api("/api/registry/skills?" + params.toString());
          document.getElementById("stats").textContent = (data.count || 0) + " skills";
          table(["Slug", "Role", "Tags", "Scope", "Status"], (data.skills || []).map((s) =>
            `<tr><td><code>${escapeHtml(s.slug)}</code></td><td>${escapeHtml(s.role)}</td><td>${escapeHtml((s.tags || []).join(", "))}</td><td>${pill(s.scope)}</td><td>${pill(s.status)}</td></tr>`
          ));
        } else if (tab === "mcps") {
          const data = await api("/api/onboarding?track=discovery");
          const rows = data.connectors_needed || [];
          document.getElementById("stats").textContent = rows.length + " connectors · example " + (data.mcp_example || "");
          table(["ID", "Required on discovery", "Hosted", "Reason"], rows.map((c) =>
            `<tr><td><code>${escapeHtml(c.id)}</code></td><td>${pill(c.required ? "required" : "optional")}</td><td><code>${escapeHtml(c.hosted || "")}</code></td><td>${escapeHtml(c.reason || "")}</td></tr>`
          ));
        } else {
          const q = document.getElementById("q")?.value.trim() || "";
          const kind = document.getElementById("kind")?.value.trim() || "";
          const params = new URLSearchParams();
          if (q) params.set("q", q);
          if (kind) params.set("kind", kind);
          const data = await api("/api/memory/recall?" + params.toString());
          const items = data.items || [];
          document.getElementById("stats").textContent = items.length + " facts";
          table(["Pod", "Kind", "Title", "Fact"], items.map((it) =>
            `<tr><td>${pill(it.pod_scope || "")}</td><td>${escapeHtml(it.kind || "")}</td><td>${escapeHtml(it.title || "")}</td><td>${escapeHtml(it.body || "")}</td></tr>`
          ));
        }
      } catch (err) {
        document.getElementById("err").textContent = err.message;
        document.getElementById("table").innerHTML = "";
        document.getElementById("stats").textContent = "";
      }
    }
    fetch("/api/auth/me").then((r) => {
      if (r.status === 401) {
        location.href = "/login?next=/admin/data";
        return null;
      }
      return r.json();
    }).then((body) => {
      if (!body) return;
      document.getElementById("who").textContent = "Signed in as " + ((body.user && body.user.email) || body.actor || body.role);
      load();
    });
  </script>

  </div>
  <nav class="hub-dock" aria-label="Primary">
    <a class="hub-nav-item" data-icon="board" data-nav="/board" href="/board">Board</a>
    <a class="hub-nav-item" data-icon="directory" data-nav="/admin/users" href="/admin/users">Directory</a>
    <a class="hub-nav-item" data-icon="invites" data-nav="/admin" href="/admin">Invites</a>
    <button class="hub-nav-item" type="button" data-icon="more" data-hub-more>More</button>
  </nav>
  <div class="hub-more" id="hubMore">
    <a href="/admin/data">Data</a>
    <a href="/admin/skills">Skills</a>
    <a href="/admin/memory">Memory</a>
    <a href="/onboarding">Candidate</a>
    <button type="button" data-hub-logout>Log out</button>
    <button type="button" class="secondary" data-hub-more-close>Close</button>
  </div>

  <script src="/static/hub.js"></script>
</body>
</html>
