<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>jobOS Harness — First admin</title>
  <link rel="icon" href="/brand/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/static/theme.css" />
  <link rel="stylesheet" href="/static/hub.css" />
</head>
<body class="hub-auth">
  <main class="ticket">
    <div class="brand" style="margin-bottom:0.85rem">
      <img src="/brand/mascot.png" alt="jobOS" width="40" height="40" />
      <div>
        <h1>Create the jobOS admin</h1>
        <p style="margin:0">One-time bootstrap. Admin is a human owner, not a job-search track. Token is not stored after signup.</p>
      </div>
    </div>
    <form id="form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
      <label for="token">Bootstrap token</label>
      <input id="token" name="token" type="password" autocomplete="off" required />
      <button type="submit">Create admin</button>
      <div class="err" id="err"></div>
    </form>
  </main>
  <script>
    fetch("/health").then((r) => r.json()).then((h) => {
      if (h.admin_bootstrapped) location.replace("/login");
    }).catch(() => {});
    const params = new URLSearchParams(location.hash.replace(/^#/, ""));
    const fromHash = params.get("bootstrap");
    if (fromHash) document.getElementById("token").value = fromHash;
    document.getElementById("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "";
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const token = document.getElementById("token").value;
      const res = await fetch("/api/auth/bootstrap", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ email, password, token }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        err.textContent = (body.detail && (body.detail.message || body.detail)) || res.statusText;
        return;
      }
      location.href = "/onboarding";
    });
  </script>
</body>
</html>
