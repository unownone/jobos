<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1814" />
  <title>jobOS Harness login</title>
  <link rel="icon" href="/brand/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/static/hub.css" />
</head>
<body class="hub-auth">
  <main class="ticket">
    <div class="brand" style="margin-bottom:0.85rem">
      <img src="/brand/mascot.png" alt="jobOS Stitch" width="40" height="40" />
      <div>
        <h1>jobOS Harness</h1>
        <p style="margin:0">Log in or create an account. Each account is isolated — jobs, resumes, and queue traffic stay in your tenant.</p>
      </div>
    </div>
    <form id="form">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
        <button type="submit">Log in</button>
        <button type="button" id="signupBtn" class="secondary">Create account</button>
      </div>
      <div class="err" id="err"></div>
    </form>
    <p class="muted">Session lasts 12 hours of idle. Username + password only — no dashboard token.</p>
    <p class="muted"><a href="/">Back to landing</a></p>
  </main>
  <script>
    const requested = new URLSearchParams(location.search).get("next") || "";
    const saved = localStorage.getItem("jobos_username") || "";
    if (saved) document.getElementById("username").value = saved;
    fetch("/api/auth/me").then((r) => {
      if (r.ok) location.href = requested || "/board";
    }).catch(() => {});

    async function submit(kind) {
      const err = document.getElementById("err");
      err.textContent = "";
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const url = kind === "signup" ? "/api/auth/signup" : "/api/auth/login";
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        err.textContent = (body.detail && (body.detail.message || body.detail)) || res.statusText;
        return;
      }
      try { localStorage.setItem("jobos_username", username); } catch (e) {}
      const status = await fetch("/api/candidate/status").then((r) => r.json()).catch(() => ({}));
      if (!status.onboarded) {
        location.href = "/onboarding";
        return;
      }
      location.href = requested || "/board";
    }
    document.getElementById("form").addEventListener("submit", (ev) => {
      ev.preventDefault();
      submit("login");
    });
    document.getElementById("signupBtn").addEventListener("click", (ev) => {
      ev.preventDefault();
      submit("signup");
    });
  </script>
</body>
</html>
