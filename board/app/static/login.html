<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1814" />
  <title>jobOS Harness — Login</title>
  <link rel="icon" href="/brand/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/static/hub.css" />
</head>
<body class="hub-auth">
  <main class="ticket">
    <div class="brand" style="margin-bottom:0.85rem">
      <img src="/brand/mascot.png" alt="jobOS Stitch" width="40" height="40" />
      <div>
        <h1>jobOS Harness login</h1>
        <p style="margin:0">jobOS Harness helps find jobs. You are the only human on this board. Workers use API keys, not this form.</p>
      </div>
    </div>
    <p>Session lasts 12 hours of idle. Email is remembered on this browser only.</p>
    <form id="form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button type="submit">Log in</button>
      <div class="err" id="err"></div>
    </form>
    <p id="signupWrap" hidden><a id="signupLink" href="/admin/signup">Create the first admin</a></p>
    <p class="muted">
      Deploy this Hub:
      <a href="https://railway.com/new/template?template=https://github.com/unownone/jobos">Railway</a>
      ·
      <a href="https://github.com/unownone/jobos/blob/main/docs/install.md#coolify">Coolify</a> (Compose: <code>docker-compose.yml</code>)
    </p>
  </main>
  <script>
    const requested = new URLSearchParams(location.search).get("next") || "";
    const savedEmail = localStorage.getItem("jobos_admin_email") || "";
    if (savedEmail) document.getElementById("email").value = savedEmail;
    fetch("/api/auth/me").then((r) => {
      if (r.ok) {
        location.href = requested || "/";
      }
    }).catch(() => {});
    fetch("/health").then((r) => r.json()).then((h) => {
      const wrap = document.getElementById("signupWrap");
      if (wrap) wrap.hidden = Boolean(h.admin_bootstrapped);
    }).catch(() => {});
    document.getElementById("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "";
      const email = document.getElementById("email").value;
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email,
          password: document.getElementById("password").value,
        }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        err.textContent = (body.detail && (body.detail.message || body.detail)) || res.statusText;
        return;
      }
      try { localStorage.setItem("jobos_admin_email", email); } catch (e) {}
      const status = await fetch("/api/candidate/status").then((r) => r.json()).catch(() => ({}));
      if (!status.onboarded) {
        location.href = "/onboarding";
        return;
      }
      location.href = requested || "/";
    });
  </script>
</body>
</html>
