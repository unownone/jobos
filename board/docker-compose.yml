# Prefer repo-root: docker compose up -d --build
# Postgres is internal-only. Data: named volume pgdata (Coolify-safe).
# Outside Postgres: set DATABASE_URL in secrets. Unset uses this bundled service.
# From inside Hub, a host database is host.docker.internal, not 127.0.0.1.
name: jobos

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${JOBOS_PG_USER:-jobos}
      POSTGRES_PASSWORD: ${JOBOS_PG_PASSWORD:-jobos}
      POSTGRES_DB: ${JOBOS_PG_DB:-jobos}
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  hub:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      JOBOS_NONINTERACTIVE: "1"
      BOARD_HOST: "0.0.0.0"
      BOARD_PORT: "8787"
      BOARD_DB: "/tmp/board.db"
      HUB_PACKS_DIR: "/tmp/jobos-packs"
      DATABASE_URL_FROM_SECRET: "${DATABASE_URL:-}"
      JOBOS_PG_USER: "${JOBOS_PG_USER:-jobos}"
      JOBOS_PG_PASSWORD: "${JOBOS_PG_PASSWORD:-jobos}"
      JOBOS_PG_HOST: "${JOBOS_PG_HOST:-postgres}"
      JOBOS_PG_PORT: "${JOBOS_PG_PORT:-5432}"
      JOBOS_PG_DB: "${JOBOS_PG_DB:-jobos}"
      HUB_PUBLIC_HOST: "${HUB_PUBLIC_HOST:-}"
      HUB_PUBLIC_URL: "${HUB_PUBLIC_URL:-}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-jobos-hub}"
      OTEL_LOGS_EXPORTER: "${OTEL_LOGS_EXPORTER:-console}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
