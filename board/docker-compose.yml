# Go API + React SPA, with Postgres always on.
# From board/: docker compose up -d --build
# SPA http://127.0.0.1:8080  API http://127.0.0.1:8081
#
# Prefer the repo-root file: docker compose up -d --build
# Postgres is internal-only. Data: named volumes pgdata and blobs.

name: jobos

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobos
      POSTGRES_PASSWORD: ${JOBOS_PG_PASSWORD:-jobos}
      POSTGRES_DB: jobos
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobos -d jobos"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "8081:8080"
    environment:
      HUB_ADDR: ":8080"
      HUB_PLUGINS: "${HUB_PLUGINS:-auto}"
      HUB_PUBLIC_URL: "${HUB_PUBLIC_URL:-http://127.0.0.1:8080}"
      DATABASE_URL: "${DATABASE_URL:-}"
      JOBOS_PG_USER: "${JOBOS_PG_USER:-jobos}"
      JOBOS_PG_PASSWORD: "${JOBOS_PG_PASSWORD:-jobos}"
      JOBOS_PG_HOST: "${JOBOS_PG_HOST:-postgres}"
      JOBOS_PG_PORT: "${JOBOS_PG_PORT:-5432}"
      JOBOS_PG_DB: "${JOBOS_PG_DB:-jobos}"
      BLOB_DRIVER: filesystem
      BLOB_ROOT: /var/lib/jobos/blobs
    volumes:
      - "blobs:/var/lib/jobos/blobs"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: ../web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  blobs:
