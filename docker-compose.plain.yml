# jobOS Hub only (no Traefik). From repo root:
#   docker compose -f docker-compose.plain.yml up -d --build
# Hub listens on http://127.0.0.1:8787
#
# Durable state: named volumes pgdata, rabbitmq, blobs (Coolify-safe).
# Postgres/RabbitMQ have no published ports. See docs/coolify.md.
#
# First visit: /login (username + password) → /onboarding → invites/agents.

name: jobos-plain

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobos
      POSTGRES_PASSWORD: ${JOBOS_PG_PASSWORD:-jobos}
      POSTGRES_DB: jobos
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobos -d jobos"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "${JOBOS_AMQP_USER:-jobos}"
      RABBITMQ_DEFAULT_PASS: "${JOBOS_AMQP_PASSWORD:-jobos}"
    volumes:
      - "rabbitmq:/var/lib/rabbitmq"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  hub:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HUB_PORT:-8787}:8787"
    environment:
      JOBOS_NONINTERACTIVE: "1"
      BOARD_HOST: "0.0.0.0"
      BOARD_PORT: "8787"
      BOARD_DB: "/tmp/board.db"
      HUB_PACKS_DIR: "/tmp/jobos-packs"
      DATABASE_URL: "postgresql://jobos:${JOBOS_PG_PASSWORD:-jobos}@postgres:5432/jobos"
      AMQP_URL: "amqp://${JOBOS_AMQP_USER:-jobos}:${JOBOS_AMQP_PASSWORD:-jobos}@rabbitmq:5672/%2F"
      QUEUE_ADAPTER: "rabbitmq"
      BLOB_ROOT: "/var/lib/jobos/blobs"
      BLOB_ADAPTER: "filesystem"
      HUB_PUBLIC_HOST: "${HUB_PUBLIC_HOST:-127.0.0.1:8787}"
      HUB_PUBLIC_URL: "${HUB_PUBLIC_URL:-http://127.0.0.1:8787}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-jobos-hub}"
      OTEL_LOGS_EXPORTER: "${OTEL_LOGS_EXPORTER:-console}"
    volumes:
      - "blobs:/var/lib/jobos/blobs"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq:
  blobs:
