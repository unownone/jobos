# Isolated Job Hub stack for browser e2e. From repo root:
#   bash scripts/e2e_browser.sh
# or:
#   docker compose -f docker-compose.e2e.yml -p jobos-e2e up -d --build
#
# SPA: http://127.0.0.1:18787  (does not clash with a laptop Hub on 8080)
# Tear down data: docker compose -f docker-compose.e2e.yml -p jobos-e2e down -v

name: jobos-e2e

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobos
      POSTGRES_PASSWORD: jobos
      POSTGRES_DB: jobos
    volumes:
      - "e2e-pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobos -d jobos"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      HUB_ADDR: ":8080"
      HUB_PLUGINS: "off"
      DATABASE_URL: "postgresql://jobos:jobos@postgres:5432/jobos?sslmode=disable"
      BLOB_DRIVER: "filesystem"
      BLOB_ROOT: "/var/lib/jobos/blobs"
      HUB_PUBLIC_URL: "http://127.0.0.1:18787"
    volumes:
      - "e2e-blobs:/var/lib/jobos/blobs"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 24

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "18787:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  e2e-pgdata:
  e2e-blobs:
