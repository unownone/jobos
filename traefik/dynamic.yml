# File provider so Traefik does not need the Docker socket (Docker 29+).
# LEGACY: routes to the single hub container on 8787 (not a split web service).
http:
  routers:
    hub:
      rule: PathPrefix(`/`)
      entryPoints:
        - web
      service: hub
    hub-secure:
      rule: PathPrefix(`/`)
      entryPoints:
        - websecure
      service: hub
      priority: 1
      tls: {}
    hub-legacy:
      rule: PathPrefix(`/`)
      entryPoints:
        - hub
      service: hub
  services:
    hub:
      loadBalancer:
        servers:
          - url: http://hub:8787
