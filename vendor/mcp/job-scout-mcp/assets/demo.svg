<svg xmlns="http://www.w3.org/2000/svg" width="900" height="616" viewBox="0 0 900 616" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; }
      .title { font-weight: 700; }
    </style>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="898" height="614" rx="14" fill="#0d1117" stroke="#30363d"/>
  <circle cx="28" cy="26" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="26" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="26" r="6" fill="#27c93f"/>
  <text x="98" y="31" fill="#8b949e" font-size="13">job-scout-mcp &#183; example interaction in an MCP client</text>
  <line x1="0" y1="52" x2="900" y2="52" stroke="#21262d"/>

  <!-- user turn -->
  <text x="40" y="82" fill="#8b949e" font-size="12" letter-spacing="1">YOU</text>
  <rect x="40" y="92" width="760" height="46" rx="12" fill="#1f6feb1a" stroke="#1f6feb55"/>
  <text x="60" y="120" fill="#e6edf3" font-size="15">Find director-level engineering roles at the companies I track, posted this month.</text>

  <!-- assistant tool call -->
  <text x="40" y="174" fill="#8b949e" font-size="12" letter-spacing="1">CLAUDE &#8594; calls tool</text>
  <rect x="40" y="184" width="620" height="34" rx="9" fill="#161b22" stroke="#30363d"/>
  <rect x="54" y="194" width="14" height="14" rx="3" fill="#d2a8ff"/>
  <text x="80" y="206" font-size="13" class="mono"><tspan fill="#d2a8ff">search_jobs</tspan><tspan fill="#8b949e">  { minSeniority: 'director', query: 'engineering' }</tspan></text>

  <!-- results heading -->
  <text x="40" y="250" fill="#8b949e" font-size="12" letter-spacing="1">4 ROLES FOUND &#183; SHOWING TOP 3</text>

  <!-- card 1 -->
  <rect x="40" y="262" width="820" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="41" y="263" width="4" height="98" fill="#2ea043"/>
  <text x="64" y="292" fill="#58a6ff" font-size="15" class="title" text-decoration="underline">Sr. Director, Field Engineering (Lakebase)</text>
  <text x="64" y="316" fill="#8b949e" font-size="13">databricks &#160;&#183;&#160; United States</text>
  <rect x="744" y="276" width="100" height="22" rx="11" fill="#23863322" stroke="#2ea04355"/>
  <text x="794" y="291" fill="#3fb950" font-size="12" text-anchor="middle" class="mono">greenhouse</text>
  <text x="844" y="316" fill="#8b949e" font-size="12" text-anchor="end">Posted 2026-07-01</text>
  <text x="64" y="342" fill="#6e7681" font-size="12.5">Lead a leadership team of technical field practitioners across North America&#8230;</text>

  <!-- card 2 -->
  <rect x="40" y="374" width="820" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="41" y="375" width="4" height="98" fill="#2ea043"/>
  <text x="64" y="404" fill="#58a6ff" font-size="15" class="title" text-decoration="underline">Director, Technical Solutions (Big Data / AI)</text>
  <text x="64" y="428" fill="#8b949e" font-size="13">databricks &#160;&#183;&#160; Bengaluru, India</text>
  <rect x="744" y="388" width="100" height="22" rx="11" fill="#23863322" stroke="#2ea04355"/>
  <text x="794" y="403" fill="#3fb950" font-size="12" text-anchor="middle" class="mono">greenhouse</text>
  <text x="844" y="428" fill="#8b949e" font-size="12" text-anchor="end">Posted 2026-07-01</text>
  <text x="64" y="454" fill="#6e7681" font-size="12.5">Lead and grow a regional team of Data &amp; AI technical experts in India&#8230;</text>

  <!-- card 3 -->
  <rect x="40" y="486" width="820" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="41" y="487" width="4" height="98" fill="#2ea043"/>
  <text x="64" y="516" fill="#58a6ff" font-size="15" class="title" text-decoration="underline">Head of AI Forward Deployed Engineering, Public Sector</text>
  <text x="64" y="540" fill="#8b949e" font-size="13">databricks &#160;&#183;&#160; Washington, D.C. metro</text>
  <rect x="744" y="500" width="100" height="22" rx="11" fill="#23863322" stroke="#2ea04355"/>
  <text x="794" y="515" fill="#3fb950" font-size="12" text-anchor="middle" class="mono">greenhouse</text>
  <text x="844" y="540" fill="#8b949e" font-size="12" text-anchor="end">Posted 2026-07-08</text>
  <text x="64" y="566" fill="#6e7681" font-size="12.5">Active U.S. government security clearance required; D.C. / MD / VA metro&#8230;</text>

  <!-- footer -->
  <text x="40" y="604" fill="#6e7681" font-size="11.5">Real output from job-scout-mcp querying public Greenhouse boards &#8212; no API keys, no scraping.</text>
</svg>
