# jobOS Hub (no Traefik). From repo root:
#   docker compose up -d --build
# Hub listens on http://127.0.0.1:8787
#
# Durable state is PostgreSQL + RabbitMQ + blobs on named Docker volumes
# (pgdata, rabbitmq, blobs). Coolify rejects ${...} in volume sources and
# wipes ~/ bind mounts on each helper checkout — see docs/coolify.md.
# docker compose down keeps volumes; docker compose down -v deletes them.
#
# Traefik (80/443): HUB_PUBLIC_HOST=your.host bash scripts/hub_docker.sh
#   uses docker-compose.traefik.yml
# Named project alias: docker compose -f docker-compose.plain.yml up -d --build
#
# First visit: /login (username + password) → /onboarding → then invites/agents.
# Agents: curl $HUB_URL/llms.txt (not HTML).
#
# Outside Postgres (not started by this file): put the URL in secrets.
#   DATABASE_URL in Coolify/Railway, repo-root .env, or a non-loopback
#   DATABASE_URL in board/.env. Unset keeps the bundled `postgres` service.
#   A database on the Docker host is host.docker.internal, not 127.0.0.1.

name: jobos

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${JOBOS_PG_USER:-jobos}"
      POSTGRES_PASSWORD: "${JOBOS_PG_PASSWORD:-jobos}"
      POSTGRES_DB: "${JOBOS_PG_DB:-jobos}"
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "${JOBOS_AMQP_USER:-jobos}"
      RABBITMQ_DEFAULT_PASS: "${JOBOS_AMQP_PASSWORD:-jobos}"
    volumes:
      - "rabbitmq:/var/lib/rabbitmq"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  hub:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: board/.env
        required: false
    environment:
      JOBOS_NONINTERACTIVE: "1"
      BOARD_HOST: "0.0.0.0"
      BOARD_PORT: "8787"
      BOARD_DB: "/tmp/board.db"
      HUB_PACKS_DIR: "/tmp/jobos-packs"
      # Empty when the secret is unset, so board/.env is not overwritten.
      DATABASE_URL_FROM_SECRET: "${DATABASE_URL:-}"
      JOBOS_PG_USER: "${JOBOS_PG_USER:-jobos}"
      JOBOS_PG_PASSWORD: "${JOBOS_PG_PASSWORD:-jobos}"
      JOBOS_PG_HOST: "${JOBOS_PG_HOST:-postgres}"
      JOBOS_PG_PORT: "${JOBOS_PG_PORT:-5432}"
      JOBOS_PG_DB: "${JOBOS_PG_DB:-jobos}"
      AMQP_URL: "amqp://${JOBOS_AMQP_USER:-jobos}:${JOBOS_AMQP_PASSWORD:-jobos}@rabbitmq:5672/%2F"
      QUEUE_ADAPTER: "rabbitmq"
      BLOB_ROOT: "/var/lib/jobos/blobs"
      BLOB_ADAPTER: "filesystem"
      HUB_PUBLIC_HOST: "${HUB_PUBLIC_HOST:-}"
      HUB_PUBLIC_URL: "${HUB_PUBLIC_URL:-}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-jobos-hub}"
      OTEL_LOGS_EXPORTER: "${OTEL_LOGS_EXPORTER:-console}"
    volumes:
      - "blobs:/var/lib/jobos/blobs"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  rabbitmq:
  blobs:
