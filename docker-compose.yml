# jobOS: React SPA + Go API.
# Postgres, Redis, and MinIO are optional profiles.
#
#   docker compose up -d --build
#   docker compose --profile data --profile cache --profile blobs up -d --build

name: jobos

services:
  api:
    build:
      context: ./server
    environment:
      HUB_ADDR: ":8080"
      HUB_PUBLIC_URL: "${HUB_PUBLIC_URL:-http://127.0.0.1:8080}"
      DATABASE_URL: "${DATABASE_URL:-}"
      REDIS_URL: "${REDIS_URL:-}"
      CACHE_DRIVER: "${CACHE_DRIVER:-memory}"
      BLOB_DRIVER: "${BLOB_DRIVER:-memory}"
      BLOB_ROOT: /var/lib/jobos/blobs
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_BUCKET: "${S3_BUCKET:-jobos}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-}"
      S3_USE_PATH_STYLE: "true"
    ports:
      - "8081:8080"
    restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    profiles: ["data"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobos
      POSTGRES_PASSWORD: "${JOBOS_PG_PASSWORD:-jobos}"
      POSTGRES_DB: jobos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobos -d jobos"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    profiles: ["cache"]
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  minio:
    profiles: ["blobs"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY:-jobos}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:-jobossecret}"
    volumes:
      - minio:/data

volumes:
  pgdata:
  minio:
