# jobOS Hub (no Traefik). From repo root:
#   docker compose up -d --build
# Hub listens on http://127.0.0.1:8787
#
# Durable state is PostgreSQL (not a Hub volume). Postgres is not published
# on the host — only the Hub container can reach it.
# Postgres files live on the host bind ~/.jobos/pgdata so compose
# project-name changes cannot wipe the database.
# Resumes live on ~/.jobos/blobs. Queue is RabbitMQ (~/.jobos/rabbitmq).
# Volume sources must be literal paths (no ${...}). Coolify rejects
# interpolation in volume sources as command-injection risk — see docs/coolify.md.
#
# Traefik (80/443): HUB_PUBLIC_HOST=your.host bash scripts/hub_docker.sh
#   uses docker-compose.traefik.yml
# Named project alias: docker compose -f docker-compose.plain.yml up -d --build
#
# First visit: /login (username + password) → /onboarding → then invites/agents.
# Agents: curl $HUB_URL/llms.txt (not HTML).

name: jobos

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobos
      POSTGRES_PASSWORD: "${JOBOS_PG_PASSWORD:-jobos}"
      POSTGRES_DB: jobos
    volumes:
      - ~/.jobos/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobos -d jobos"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "${JOBOS_AMQP_USER:-jobos}"
      RABBITMQ_DEFAULT_PASS: "${JOBOS_AMQP_PASSWORD:-jobos}"
    volumes:
      - ~/.jobos/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  hub:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      JOBOS_NONINTERACTIVE: "1"
      BOARD_HOST: "0.0.0.0"
      BOARD_PORT: "8787"
      BOARD_DB: "/tmp/board.db"
      HUB_PACKS_DIR: "/tmp/jobos-packs"
      DATABASE_URL: "postgresql://jobos:${JOBOS_PG_PASSWORD:-jobos}@postgres:5432/jobos"
      AMQP_URL: "amqp://${JOBOS_AMQP_USER:-jobos}:${JOBOS_AMQP_PASSWORD:-jobos}@rabbitmq:5672/%2F"
      QUEUE_ADAPTER: "rabbitmq"
      BLOB_ROOT: "/var/lib/jobos/blobs"
      BLOB_ADAPTER: "filesystem"
      HUB_PUBLIC_HOST: "${HUB_PUBLIC_HOST:-}"
      HUB_PUBLIC_URL: "${HUB_PUBLIC_URL:-}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-jobos-hub}"
      OTEL_LOGS_EXPORTER: "${OTEL_LOGS_EXPORTER:-console}"
    volumes:
      - ~/.jobos/blobs:/var/lib/jobos/blobs
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
