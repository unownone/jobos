# Job Hub behind Traefik. From repo root:
#   HUB_PUBLIC_HOST=12.234.244.34 docker compose up -d --build
# Traefik listens on 80 and 443. The board is served at /.
# Memory pods live in Hub SQLite on hub-data (no extra vector-DB / Mem0 service).
#
# Plain Hub on :8787 (no Traefik): docker compose -f docker-compose.plain.yml up -d --build
# First operator step after signup is always /onboarding.
#
# HUB_PUBLIC_HOST may be a hostname, IPv4, or IP:port (invites use that origin).

name: jobos

services:

  hub:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      JOBOS_NONINTERACTIVE: "1"
      BOARD_HOST: "0.0.0.0"
      BOARD_PORT: "8787"
      HUB_PUBLIC_HOST: "${HUB_PUBLIC_HOST:-}"
      HUB_PUBLIC_URL: "${HUB_PUBLIC_URL:-}"
    volumes:
      - hub-data:/data
    ports:
      - "8787:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  hub-data:
