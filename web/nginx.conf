server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
  location /health { proxy_pass http://api:8080; }
  location /ready { proxy_pass http://api:8080; }
  location /llms.txt { proxy_pass http://api:8080; }
  location /agents.txt { proxy_pass http://api:8080; }
  location /.well-known/ { proxy_pass http://api:8080; }
  location /a2a { proxy_pass http://api:8080; }
  location /ws {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
  location /api/stream {
    proxy_pass http://api:8080;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
