      Attach on discovery env if ats-jobs-mcp is not enough. Adds HN Who is Hiring
      + RemoteOK + optional Adzuna/USAJobs on top of public ATS JSON. ToS-clean
      (no scrape). Overlaps ats-jobs-mcp — pick one ATS path, keep RemoteOK HTTP either way.
    notes: Maintainer pass 2026-09-06. Glama listing confirmed public Greenhouse/Lever/Ashby/HN/RemoteOK.

