items:
  - id: linkedin-mcp-stickerdaniel
    kind: mcp
    name: stickerdaniel/linkedin-mcp-server
    capability: [discovery, research]
    roles: [discovery]
    platforms: [linkedin]
    source: https://github.com/stickerdaniel/linkedin-mcp-server
    install: session MCP; allowlist search_jobs, get_job_details, search_people
    auth: session
    verdict: fork
    next_action: Only after the human says they own a LinkedIn session. Disable send_message on discovery.
    notes: No official LinkedIn Jobs MCP exists. Cookie/session product — warn ToS.

  - id: hs-linkedin-resolve
    kind: mcp
    name: hs-linkedin-mcp (resolve_apply_url only)
    capability: [apply, discovery]
    roles: [apply]
    platforms: [linkedin]
    source: https://github.com/michaeltabet/hs-linkedin-mcp
    install: Brave CDP session
    auth: session
    verdict: fork
    next_action: Apply-role only. Use resolve_apply_url so packets store the real ATS URL. Do not enable Easy Apply drive-to-completion on discovery.
    notes: Maintainer pass 2026-09-06. Full server also walks Easy Apply — that path is apply-role after a packet, never discovery.

  - id: apollo-people
    kind: mcp
    name: Apollo MCP (people + enrichment only)
    capability: [research, outreach]
    roles: [outreach]
    platforms: [gmail, linkedin]
    source: https://docs.apollo.io/docs/apollo-mcp
    install: https://mcp.apollo.io/mcp OAuth
    auth: oauth
    verdict: fork
    next_action: Attach on outreach env. Deny-list sequence tools. People search OK.
    notes: Sequences are spray. Off unless the user adds that channel.

  - id: brave-search-mcp
    kind: mcp
    name: Brave Search MCP
    capability: [research]
    roles: [all]
