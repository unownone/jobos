slug: apply-ashby
name: Ashby apply
kind: skill
role: apply
tags: [apply, ats, ashby]
platform: ashby
match:
  ats: [ashby]
  url_patterns:
    - "jobs.ashbyhq.com/*"
    - "*.ashbyhq.com/*"
  apply_kind: [ats]
reproducible: true
inputs: [job, apply_packet, candidate]
outputs: [proof]
body: |
  # Ashby apply

  Same steps for every Ashby-hosted job.

  ## Steps

  1. Claim apply. Open packet URL.
  2. Complete Ashby fields from profile. Upload PDF.
  3. Specific note. Submit. Proof. `applied`.

  If the posting died, `closed_expired` and bounce to discovery.

  ## Hard no

  Inventing jobs. Skipping screening questions.
