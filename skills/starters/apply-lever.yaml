slug: apply-lever
name: Lever apply
kind: skill
role: apply
tags: [apply, ats, lever]
platform: lever
match:
  ats: [lever]
  url_patterns:
    - "jobs.lever.co/*"
    - "*.lever.co/*"
  apply_kind: [ats]
reproducible: true
inputs: [job, apply_packet, candidate]
outputs: [proof]
body: |
  # Lever apply

  Same steps for every `jobs.lever.co` posting.

  ## Steps

  1. Claim apply. Open packet URL. Confirm title/company.
  2. Fill Lever fields from profile + packet. Upload the named PDF.
  3. Specific short letter. Submit. Proof. `applied` + outreach seed.

  Blocked: captcha, extra work-auth questions not in the profile.

  ## Hard no

  Guessing a different Lever URL. Cold outreach from this skill.
