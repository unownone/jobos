slug: apply-workday
name: Workday apply
kind: skill
role: apply
tags: [apply, ats, workday]
platform: workday
match:
  ats: [workday]
  url_patterns:
    - "*.myworkdayjobs.com/*"
    - "*workday.com/*"
  apply_kind: [ats]
reproducible: true
inputs: [job, apply_packet, candidate]
outputs: [proof]
body: |
  # Workday apply

  If this works for one Workday job, it works for the next `*.myworkdayjobs.com` job. Tenant quirks stay on a **local** fork until maintainer promotes them.

  ## Steps

  1. Claim apply. Open the packet URL. Confirm requisition id matches `req_id` / packet.
  2. Create or use the account named in the packet (candidate email). Do not invent a new identity.
  3. Work through Workday pages in order: My Information → My Experience → Application questions → Review.
  4. Upload the named PDF. Map resume fields; do not fabricate employers or dates.
  5. Answer screening from the profile. Unknown legal / work-auth → `apply_blocked`.
  6. Submit. Proof must include confirmation text/URL and req id. Then `applied`.

  Browser: Playwright MCP / playwright-cli on the apply bot only.

  ## Hard no

  Skipping req id. Using a different Workday tenant URL than the packet. Easy Apply (that is LinkedIn).
