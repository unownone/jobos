# LEGACY Hub behind Traefik. Port 8787 and env names match the old deploy.
# Go API + SPA in one `hub` container. No RabbitMQ.
#
#   HUB_PUBLIC_HOST=hunt.example.com bash scripts/hub_docker.sh
# Traefik listens on 80, 443, and 8787. All three reach hub:8787.

name: jobos-traefik

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobos
      POSTGRES_PASSWORD: ${JOBOS_PG_PASSWORD:-jobos}
      POSTGRES_DB: jobos
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobos -d jobos"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  traefik:
    image: traefik:v3.3
    ports:
      - "80:80"
      - "443:443"
      - "8787:8787"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy

  # LEGACY: service name `hub`, BOARD_* / JOBOS_PG_* / BLOB_* unchanged.
  hub:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      JOBOS_NONINTERACTIVE: "1"
      BOARD_HOST: "0.0.0.0"
      BOARD_PORT: "8787"
      BOARD_DB: "/tmp/board.db"
      HUB_PACKS_DIR: "/tmp/jobos-packs"
      HUB_REPO_ROOT: "/opt/jobos"
      HUB_WEB_ROOT: "/opt/jobos/web"
      HUB_PLUGINS: "${HUB_PLUGINS:-auto}"
      DATABASE_URL: "${DATABASE_URL:-}"
      JOBOS_PG_USER: "${JOBOS_PG_USER:-jobos}"
      JOBOS_PG_PASSWORD: "${JOBOS_PG_PASSWORD:-jobos}"
      JOBOS_PG_HOST: "${JOBOS_PG_HOST:-postgres}"
      JOBOS_PG_PORT: "${JOBOS_PG_PORT:-5432}"
      JOBOS_PG_DB: "${JOBOS_PG_DB:-jobos}"
      # LEGACY: kept for existing secrets. Queue is Postgres; AMQP unused.
      AMQP_URL: "${AMQP_URL:-}"
      QUEUE_ADAPTER: "${QUEUE_ADAPTER:-postgres}"
      BLOB_ROOT: "/var/lib/jobos/blobs"
      BLOB_ADAPTER: "${BLOB_ADAPTER:-filesystem}"
      BLOB_DRIVER: "${BLOB_DRIVER:-}"
      HUB_PUBLIC_HOST: "${HUB_PUBLIC_HOST:-}"
      HUB_PUBLIC_URL: "${HUB_PUBLIC_URL:-}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-jobos-hub}"
      OTEL_LOGS_EXPORTER: "${OTEL_LOGS_EXPORTER:-console}"
    volumes:
      - "blobs:/var/lib/jobos/blobs"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8787"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  blobs:
