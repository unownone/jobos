# jobOS Hub behind Traefik. From repo root:
#   HUB_PUBLIC_HOST=hunt.example.com bash scripts/hub_docker.sh
# Traefik listens on 80, 443, and 8787. All three reach the SPA.
# The SPA proxies /api, /ws, /health, and /a2a to the Go API.

name: jobos-traefik

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobos
      POSTGRES_PASSWORD: ${JOBOS_PG_PASSWORD:-jobos}
      POSTGRES_DB: jobos
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobos -d jobos"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  traefik:
    image: traefik:v3.3
    ports:
      - "80:80"
      - "443:443"
      - "8787:8787"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      HUB_ADDR: ":8080"
      HUB_PLUGINS: "${HUB_PLUGINS:-auto}"
      HUB_PUBLIC_HOST: "${HUB_PUBLIC_HOST:-}"
      HUB_PUBLIC_URL: "${HUB_PUBLIC_URL:-}"
      DATABASE_URL: "${DATABASE_URL:-}"
      JOBOS_PG_USER: "${JOBOS_PG_USER:-jobos}"
      JOBOS_PG_PASSWORD: "${JOBOS_PG_PASSWORD:-jobos}"
      JOBOS_PG_HOST: "${JOBOS_PG_HOST:-postgres}"
      JOBOS_PG_PORT: "${JOBOS_PG_PORT:-5432}"
      JOBOS_PG_DB: "${JOBOS_PG_DB:-jobos}"
      BLOB_DRIVER: filesystem
      BLOB_ROOT: /var/lib/jobos/blobs
    volumes:
      - "blobs:/var/lib/jobos/blobs"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: ./web
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
  blobs:
