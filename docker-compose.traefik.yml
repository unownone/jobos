# jobOS Hub behind Traefik. From repo root:
#   HUB_PUBLIC_HOST=hunt.example.com bash scripts/hub_docker.sh
# Traefik listens on 80 and 443. Landing is served at /. Board is /board.
# Default Hub-only compose (no Traefik): docker compose up -d --build  (port 8787)
#
# Durable state: named volumes pgdata and blobs (Coolify-safe). Queue is Postgres.
# Traefik config is repo-relative ./traefik/*. Do not put ${...} in volume sources.
#
# First operator step after signup is always /onboarding.
#
# HUB_PUBLIC_HOST may be a hostname, IPv4, or IP:port (invites use that origin).
#
# Outside Postgres: set secret DATABASE_URL (Coolify/Railway, repo-root .env,
# or the shell). Unset uses the bundled `postgres` service.
# A database on the Docker host is host.docker.internal, not 127.0.0.1.

name: jobos-traefik

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobos
      POSTGRES_PASSWORD: ${JOBOS_PG_PASSWORD:-jobos}
      POSTGRES_DB: jobos
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobos -d jobos"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  traefik:
    image: traefik:v3.3
    ports:
      - "80:80"
      - "443:443"
      - "8787:8787"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy

  hub:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      JOBOS_NONINTERACTIVE: "1"
      BOARD_HOST: "0.0.0.0"
      BOARD_PORT: "8787"
      BOARD_DB: "/tmp/board.db"
      HUB_PACKS_DIR: "/tmp/jobos-packs"
      DATABASE_URL: "${DATABASE_URL:-}"
      JOBOS_PG_USER: "${JOBOS_PG_USER:-jobos}"
      JOBOS_PG_PASSWORD: "${JOBOS_PG_PASSWORD:-jobos}"
      JOBOS_PG_HOST: "${JOBOS_PG_HOST:-postgres}"
      JOBOS_PG_PORT: "${JOBOS_PG_PORT:-5432}"
      JOBOS_PG_DB: "${JOBOS_PG_DB:-jobos}"
      QUEUE_ADAPTER: "memory"
      BLOB_ROOT: "/var/lib/jobos/blobs"
      BLOB_ADAPTER: "filesystem"
      HUB_PUBLIC_HOST: "${HUB_PUBLIC_HOST:-}"
      HUB_PUBLIC_URL: "${HUB_PUBLIC_URL:-}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-jobos-hub}"
      OTEL_LOGS_EXPORTER: "${OTEL_LOGS_EXPORTER:-console}"
    volumes:
      - "blobs:/var/lib/jobos/blobs"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8787"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  blobs:
